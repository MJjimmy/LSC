<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
<title id="title">LSC GitHub CI and Railway delivery flow</title>
<desc id="description">Developer changes are pushed to two GitHub repositories. Android GitHub Actions builds and tests the debug APK, publishes APK and test reports, and leads to manual phone testing. Backend GitHub Actions runs validation workflows and reports results. Failed checks require fixing code and pushing again. A separate configured-source or release action feeds Railway deployment of the PHP web service connected to private MySQL. A CI-blocking Railway deployment gate has not been verified.</desc>
