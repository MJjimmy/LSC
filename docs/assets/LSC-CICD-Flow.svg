<text x="1520" y="512" font-size="19" font-weight="400" fill="#abc0ce" text-anchor="start">CI checks do not deploy.</text>
<text x="1520" y="548" font-size="19" font-weight="400" fill="#abc0ce" text-anchor="start">Railway deploys separately.</text>
<text x="1520" y="584" font-size="19" font-weight="400" fill="#abc0ce" text-anchor="start">A CI-blocking release gate</text>
