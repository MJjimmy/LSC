  <rect x="1140" y="710" width="270" height="58" rx="8" fill="#ffffff" stroke="#b8c8d0" stroke-width="2"/><text x="1275" y="747" fill="#243746" font-family="Arial, sans-serif" font-weight="700" font-size="17" text-anchor="middle">Microsoft</text>
