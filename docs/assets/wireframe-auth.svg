  <text x="875" y="353" fill="#91a1aa" font-family="Arial, sans-serif" font-size="18">student@institution.ac.za</text>
  <text x="850" y="420" fill="#243746" font-family="Arial, sans-serif" font-weight="700" font-size="18">Password</text>
