  <circle cx="148" cy="610" r="8" fill="#61d895"/><text x="175" y="618" fill="#dcecf2" font-family="Arial, sans-serif" font-size="20">Secure institution-ready workspace</text>
  <circle cx="148" cy="660" r="8" fill="#61d895"/><text x="175" y="668" fill="#dcecf2" font-family="Arial, sans-serif" font-size="20">Works on desktop and mobile</text>
