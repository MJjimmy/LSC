  <text x="850" y="180" fill="#172a3a" font-family="Arial, sans-serif" font-weight="700" font-size="34">Sign in to LSC</text>
  <text x="850" y="225" fill="#607181" font-family="Arial, sans-serif" font-size="19">Use your account or an approved institution identity.</text>
  <text x="850" y="295" fill="#243746" font-family="Arial, sans-serif" font-weight="700" font-size="18">Email address</text>
