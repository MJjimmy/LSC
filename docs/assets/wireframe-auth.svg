  <text x="130" y="335" fill="#ffffff" font-family="Arial, sans-serif" font-weight="700" font-size="38">Your study group,</text>
  <text x="130" y="386" fill="#ffffff" font-family="Arial, sans-serif" font-weight="700" font-size="38">in one place.</text>
  <text x="130" y="465" fill="#dcecf2" font-family="Arial, sans-serif" font-size="22">Connect with classmates, coordinate</text>
