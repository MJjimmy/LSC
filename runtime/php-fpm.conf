[global]
error_log = /proc/self/fd/2
daemonize = no
[www]
listen = /tmp/lsc/php-fpm.sock
listen.mode = 0600
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 500
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
security.limit_extensions = .php
request_terminate_timeout = 60s
ping.path = /healthz
ping.response = ok
php_admin_value[session.save_path] = /tmp/lsc/sessions
