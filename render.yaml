services:
  - type: web
    name: lsc-web
    runtime: docker
    dockerfilePath: ./Dockerfile.railway
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: PGHOST
        sync: false
      - key: PGPORT
        value: "5432"
      - key: PGDATABASE
        value: lsc_db
      - key: PGUSER
        value: lsc_db_user
      - key: PGPASSWORD
        sync: false
      - key: APP_URL
        sync: false
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "0"