name: LSC security regression audit
on:
  push:
    branches: [security/2026-10-22-hardening]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  csrf-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out audited source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Confirm existing PHP runtime
        run: php --version
      - name: Lint isolated regression test
        run: php -l tests/security_csrf_regression.php
      - name: Verify empty-token CSRF rejection
        run: php tests/security_csrf_regression.php
      - name: Verify task membership boundary with isolated fixtures
        run: php tests/security_task_membership.php
