name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-lint:
    name: PHP syntax lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, mbstring, curl
      - name: Lint every PHP file
        run: |
          fail=0
          while IFS= read -r file; do
            php -l "$file" >/dev/null || fail=1
          done < <(find app bin config public views -name '*.php' -type f)
          if [ "$fail" -ne 0 ]; then
            echo "One or more PHP files failed syntax lint" >&2
            exit 1
          fi
          echo "All PHP files passed syntax lint"

  schema-import:
    name: Schema imports into Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: lsc_user
          POSTGRES_PASSWORD: lsc_pass
          POSTGRES_DB: lsc_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lsc_user -p 5432"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql
      - name: Import consolidated schema
        run: |
          psql -h 127.0.0.1 -U lsc_user -d lsc_ci -f database/init-postgres.sql
      - name: Verify tables and columns the app depends on
        run: |
          php -r '
            $pdo = new PDO("pgsql:host=127.0.0.1;port=5432;dbname=lsc_ci", "lsc_user", "lsc_pass", [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
            $tables = $pdo->query("SELECT table_name FROM information_schema.tables WHERE table_schema = 'public'")->fetchAll(PDO::FETCH_COLUMN);
            $required = ["files","group_invitations","group_join_requests","group_members","messages","notification_queue","notifications","password_reset_tokens","rate_limits","study_groups","tasks","users"];
            $missing = array_diff($required, $tables);
            if ($missing) { fwrite(STDERR, "Missing tables: " . implode(", ", $missing) . PHP_EOL); exit(1); }
            $columns = fn(string $table) => $pdo->query("SELECT column_name FROM information_schema.columns WHERE table_schema = 'public' AND table_name = '$table'")->fetchAll(PDO::FETCH_COLUMN);
            foreach (["phone_number","notify_email","notify_sms","bio","institution","course","avatar_path"] as $c) {
                if (!in_array($c, $columns("users"))) { fwrite(STDERR, "users missing column: $c" . PHP_EOL); exit(1); }
            }
            if (!in_array("file_id", $columns("messages"))) { fwrite(STDERR, "messages missing column: file_id" . PHP_EOL); exit(1); }
            echo "Schema OK: " . count($tables) . " tables\n";
          '
