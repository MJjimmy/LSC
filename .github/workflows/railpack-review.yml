name: Runtime review checks (no deployment)

on:
  push:
    branches: [deploy/railpack]
  pull_request:
    paths:
      - composer.json
      - railpack.json
      - Caddyfile
      - php.ini
      - tests/railpack_config_test.py
      - tests/runtime_config_test.py
      - tests/group_wiring_test.py
      - public/groups.php
      - public/logout.php
      - public/login.php
      - public/register.php
      - public/forgot-password.php
      - public/reset-password.php
      - public/group.php
      - app/Groups/GroupController.php
      - tests/runtime_smoke_test.py
      - tests/volume_runtime_test.py
      - tests/database_runtime_test.py
      - tests/mysql_transfer_runtime_test.py
      - tests/cutover_gate_runtime_test.py
      - bin/transfer-to-mysql.php
      - config/bootstrap.php
      - Dockerfile.database
      - Dockerfile.database.dockerignore
      - database/init.sql
      - Dockerfile.railway
      - Dockerfile.railway.dockerignore
      - runtime/**
      - .github/workflows/railpack-review.yml

permissions:
  contents: read

jobs:
  deployment-contract:
    name: Runtime and database verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact review commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify configuration without cloud credentials or deployment
        run: |
          python3 tests/railpack_config_test.py
          python3 tests/runtime_config_test.py
          python3 tests/group_wiring_test.py
      - name: Build the pinned production runtime locally
        run: docker build --platform linux/amd64 --network default -f Dockerfile.railway -t lsc-runtime-fixed:review .
      - name: Exercise the isolated runtime without deploying
        run: python3 tests/runtime_smoke_test.py
      - name: Verify root-owned upload storage and privilege drop
        run: python3 tests/volume_runtime_test.py
      - name: Build the pinned database with the fresh-install schema
        run: docker build --platform linux/amd64 --network default -f Dockerfile.database -t lsc-database:review .
      - name: Verify database initialization and restart persistence
        run: python3 tests/database_runtime_test.py
      - name: Verify the optional cutover maintenance gate
        run: python3 tests/cutover_gate_runtime_test.py
      - name: Rehearse MariaDB to MySQL preservation without cloud access
        run: python3 tests/mysql_transfer_runtime_test.py
