version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: lsc_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lsc_db
      MYSQL_USER: lsc_user
      MYSQL_PASSWORD: lsc_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # init.sql is the complete consolidated schema (see README > Database setup)
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - lsc_net

  phpmyadmin:
    image: phpmyadmin:5
    container_name: lsc_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - lsc_net

volumes:
  mysql_data:

networks:
  lsc_net:
    driver: bridge
